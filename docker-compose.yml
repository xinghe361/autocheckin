# 自动签到 · 极空间 NAS 部署模板
#
# 用法：把这个文件和它同级的 data/ 目录放在一起，然后
#   docker compose up -d      （或极空间 Docker 界面里导入这份 compose）
#
# 数据会落在 ./data（与 compose 文件同级），看得见、能直接备份、也能整体搬走。

services:
  autocheckin:
    image: xinghe361/autocheckin:latest
    container_name: autocheckin
    restart: unless-stopped

    # ---------------------------------------------------------------
    # 网络：用 host 模式
    #
    # 为什么不用 ports 映射：host 模式下容器直接使用宿主网络，
    # 容器内监听什么端口，NAS 上就是什么端口（ports 会被忽略）。
    # 镜像内默认监听 28999 —— 这个端口是特意选的：8080 等在 NAS 上
    # 常被系统服务占用，host 模式撞端口会直接启动失败。
    # 启动后访问：http://你的NAS地址:28999/
    # ---------------------------------------------------------------
    network_mode: host

    # 安全加固：限制容器内进程提权。对本程序没有副作用，建议保留。
    security_opt:
      - no-new-privileges:true

    # /dev/shm 大小。Docker 默认只给 64MB，Chromium 渲染缓冲容易用满而崩溃。
    # 只有用到"浏览器模式"的站点才会消耗它（内置三个站点走纯请求，用不到）。
    shm_size: "256m"

    environment:
      - TZ=Asia/Shanghai
      - PORT=28999
      # 数据目录：与下面 volumes 的容器侧保持一致，不要改。
      - DATA_DIR=/data
      - LOG_LEVEL=info
      # 全局代理：所有站点与浏览器统一走它。
      # 也可以在网页「设置 → 网络」里改（网页设置优先）。
      # 不需要代理就把这行删掉。
      - PROXY=http://你的代理地址:7890
      # 加密密钥（可选）：建议自己生成固定值，这样重建容器/换机后
      # 已保存的站点密码与 Cookie 仍能解开。
      #   生成: docker run --rm xinghe361/autocheckin:latest python -c \
      #         "from cryptography.fernet import Fernet;print(Fernet.generate_key().decode())"
      # 不想自己管，也可以在网页「凭据加密密钥」里备份到 WebDAV。
      # - AUTOCHECKIN_KEY=在这里填入生成的密钥

    volumes:
      # 数据目录：配置、加密密钥、运行状态都在这里。
      #
      # 容器内那一侧必须是 /data（与上面的 DATA_DIR 一致）。
      # 宿主那一侧用相对路径 ./data —— 相对 compose 文件所在目录，
      # 所以整个文件夹可以整体搬走，不会丢配置。
      #
      # ⚠️ 注意不要改成 /app/data：那和 DATA_DIR=/data 不是同一个目录，
      #    数据会写进容器内部（镜像层），容器一重建就全丢。
      - ./data:/data

# ============================================================
#  备选一：桥接模式 + 端口映射（不想用 host 模式时）
# ============================================================
# 把上面那份整体注释掉，用这份。区别只有 network_mode 换成 ports。
#
# services:
#   autocheckin:
#     image: xinghe361/autocheckin:latest
#     container_name: autocheckin
#     restart: unless-stopped
#     ports:
#       # 宿主端口 : 容器内端口。想换宿主端口只改冒号左边。
#       - "28999:28999"
#     security_opt:
#       - no-new-privileges:true
#     shm_size: "256m"
#     volumes:
#       - ./data:/data
#     environment:
#       - TZ=Asia/Shanghai
#       - PORT=28999
#       - DATA_DIR=/data
#       - PROXY=http://你的代理地址:7890

# ============================================================
#  备选二：想把数据放到别的盘（不要放系统分区）
# ============================================================
# 极空间的盘符是"每块磁盘一个"，形如 /data_XXXXXXXX/data/。
# 直接把宿主侧换掉即可，容器侧仍然是 /data：
#
#     volumes:
#       - /data_XXXXXXXX/data/autocheckin:/data
#
# ⚠️ 不要写成 /data/... ：那通常是系统分区，空间很小（实测只有几百 MB 空闲），
#    写满可能影响整台 NAS。请在文件管理器里确认是哪块数据盘。
#
# 也可以直接在极空间界面里点「添加文件夹」用文件管理器选，连路径都不用打。

# ============================================================
#  备选三：以非 root 运行（更严格，但要手动改属主）
# ============================================================
#   services:
#     autocheckin:
#       user: "1000:1000"
#       security_opt:
#         - no-new-privileges:true
#
# 先把宿主数据目录属主改成 1000，否则启动会权限拒绝：
#   sudo chown -R 1000:1000 ./data
#
# 注意：非 root 之后 Chromium 自带沙箱无法开启（其辅助程序需要 root + setuid），
# 所以"非 root + 开沙箱 + 免配置"三者最多满足两个。

# ============================================================
#  可选：复用 NAS 上已有的 Chrome 容器
# ============================================================
# 若已跑着带调试端口的 Chrome，可以让本服务连它，省掉镜像内的浏览器。
# Chrome 的调试端口通常只绑在它自己容器的 127.0.0.1 上，要连上必须共享
# 它的网络命名空间：
#
#   services:
#     autocheckin:
#       network_mode: "container:你的chrome容器名"
#
# 这样本服务的端口就无法对外暴露（Web 界面只能在那个容器的桌面里访问），
# 所以一般仍推荐用镜像内置浏览器。确实需要时：
#   在网页「设置 → 网络 → 连接已有 Chrome」里填 http://127.0.0.1:9222
